[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "baslt"
dynamic = ["version"]
description = "Compile huge simulation runs into tiny review artifacts with verified fidelity contracts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ferris Moser" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["simulation", "time series", "review", "compression", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.8"]
mat = ["scipy>=1.10", "h5py>=3.8"]
yaml = ["pyyaml>=6"]
all = ["baslt[hdf5,mat,yaml]"]

[project.scripts]
baslt = "baslt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "scipy>=1.10",
    "h5py>=3.8",
    "pyyaml>=6",
]

[tool.uv]
# Rebuild the local package whenever its sources change, not only when this file does.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.hatch.version]
path = "src/baslt/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/baslt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests (benchmarks, large sweeps)",
    "octave: requires GNU Octave",
    "browser: requires a headless Chromium",
    "minimal: runs without optional extras installed",
]
