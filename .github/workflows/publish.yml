name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/baslt/_version.py)"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $pkg" >&2
            exit 1
          fi

      - name: Test
        run: uv run --group dev pytest -q -m "not slow and not octave and not browser"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
